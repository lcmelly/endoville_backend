[project]
site_name = "Endoville Backend Documentation"
site_url = "https://api.endovillehealth.com"
nav = [
  { "Guide" = [
        { "Start" = [
            "index.md",
            "guides/getting-started.md",
            "architecture.md"
        ]}
    ]},
  { "API" = [
        "api/index.md",
        { "Accounts" = [
            "api/registration.md",
            "api/otp.md",
            "api/activation.md",
            "api/login.md",
            "api/google-login.md",
            "api/profile.md",
            "api/is-staff.md",
            "api/staff-users.md",
            "api/customers.md"
        ]},
        { "Catalog" = [
            "api/blogs.md",
            "api/products.md"
        ]},
        { "Commerce" = [
            "api/cart.md",
            "api/orders.md",
            "api/shipping-rates.md",
            "api/warehouses.md",
            "api/payments.md",
            "api/shipments.md",
            "api/audit.md"
        ]}
    ]}
]
extra_css = ["assets/css/custom.css"]

[project.theme]
custom_dir = "docs/overrides"
favicon = "assets/images/favicon-32x32.png"
logo = "assets/images/apple-touch-icon.png"
features = [
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.top",
    "navigation.expand",
    "navigation.path",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate"
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
