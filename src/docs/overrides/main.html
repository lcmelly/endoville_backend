{% extends "base.html" %}

{% block extrahead %}
  <style>
    body[data-md-color-scheme="default"] img.endoville-home-logo--dark,
    body[data-md-color-scheme="default"] img[src$="#only-dark"],
    body[data-md-color-scheme="slate"] img.endoville-home-logo--light,
    body[data-md-color-scheme="slate"] img[src$="#only-light"] {
      display: none !important;
    }
  </style>
{% endblock %}

{% block site_meta %}
  {{ super() }}
  <link rel="icon" href="{{ 'assets/images/favicon.ico' | url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ 'assets/images/favicon-32x32.png' | url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ 'assets/images/favicon-16x16.png' | url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ 'assets/images/apple-touch-icon.png' | url }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ 'assets/images/android-chrome-192x192.png' | url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ 'assets/images/android-chrome-512x512.png' | url }}">
{% endblock %}
